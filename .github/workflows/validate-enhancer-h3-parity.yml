name: Validate Enhancer H3 parity

on:
  pull_request:
    paths:
      - 'enhancer/src/callbacks.py'
      - 'enhancer/src/server.py'
      - 'enhancer/src/gpu.py'
      - 'enhancer/src/video_encoder.py'
      - 'enhancer/src/video_pipeline.py'
      - 'enhancer/src/quality_pipeline.py'
      - 'enhancer/src/vfi_postprocess.py'
      - 'enhancer/tests/test_callbacks.py'
      - 'enhancer/tests/test_gpu_qualification.py'
      - 'enhancer/tests/test_h3_lifecycle_parity.py'
      - 'enhancer/tests/test_video_encoder.py'
      - '.github/workflows/validate-enhancer-h3-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check Enhancer runtime
        run: |
          python -m py_compile \
            enhancer/src/callbacks.py \
            enhancer/src/server.py \
            enhancer/src/gpu.py \
            enhancer/src/video_encoder.py \
            enhancer/src/video_pipeline.py \
            enhancer/src/quality_pipeline.py \
            enhancer/src/vfi_postprocess.py \
            enhancer/tests/test_callbacks.py \
            enhancer/tests/test_gpu_qualification.py \
            enhancer/tests/test_h3_lifecycle_parity.py \
            enhancer/tests/test_video_encoder.py
      - name: Run lightweight lifecycle and encoder qualification tests
        run: |
          python - <<'PY'
          from enhancer.tests import test_callbacks, test_gpu_qualification, test_h3_lifecycle_parity, test_video_encoder

          for module in (test_callbacks, test_gpu_qualification, test_h3_lifecycle_parity, test_video_encoder):
              for name in sorted(dir(module)):
                  if name.startswith('test_'):
                      getattr(module, name)()
                      print(f'PASS {module.__name__}.{name}')
          PY
